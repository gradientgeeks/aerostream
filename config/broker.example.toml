# AeroStream Rust Broker — example configuration.
#
# Usage:
#   ./rust-broker/target/release/rust-broker --config config/broker.example.toml
#
# Any value here can be overridden by an explicit CLI flag (e.g. --data-port).

# Unique broker ID within the cluster.
id = 1

# Bind IP for the TCP data plane.
host = "127.0.0.1"

# TCP port for client produce/consume operations.
data_port = 9091

# gRPC endpoint of the Go control plane. Use https:// to enable client TLS to
# the controller (see [tls].ca_file below).
controller = "http://127.0.0.1:8001"

# Where partition log files are stored. Defaults to ./data/broker_{id}.
# storage_dir = "./data/broker_1"

[storage]
# Max size of an active log segment before it rolls over (bytes). 128 MiB.
max_segment_size = 134217728
# Max total on-disk size of a partition before old segments are evicted (bytes). 1 GiB.
max_retention_size = 1073741824
# Max age of a segment before it is eligible for deletion (seconds). 7 days.
max_retention_age_secs = 604800

[tls]
# Enable TLS on the TCP data plane. NOTE: enabling this disables the sendfile
# zero-copy fast path — consume/replication data is copied through userspace
# for encryption.
enabled = false
# Server certificate / key (PEM) presented on the data plane.
# cert_file = "config/certs/broker.crt"
# key_file  = "config/certs/broker.key"
# CA used to verify the controller's TLS cert (when controller is https://) and
# peer brokers during replication.
# ca_file   = "config/certs/ca.crt"

[auth]
# Shared bearer token. When set, it is sent as gRPC "authorization" metadata to
# the controller and as the data-plane AUTH handshake to peer brokers. Empty
# disables authentication.
# token = "change-me-super-secret-token"

# Iceberg topics: tail topics into an Apache Iceberg v2 table (Parquet data files,
# Avro manifests, metadata.json + version-hint.text under <warehouse>/<namespace>/<topic>/).
# [iceberg]
# enabled = true
# warehouse = "file:///var/lib/aerostream/warehouse"   # or "s3://bucket/prefix" (uses [tiered_storage.s3])
# namespace = "aerostream"
# commit_interval_secs = 60
# max_rows_per_commit = 100000
# [[iceberg.topics]]
# name = "orders"
# mode = "json"                                         # "key_value" (default) or "json"
# json_fields = ["user:string", "amount:double", "qty:long"]
# ---------------------------------------------------------------------------
# Transactions (KIP-98 / KIP-890 TV1): coordinator runs inside the broker.
# State: <storage_dir>/__txn_state/txn.journal (+ per-partition txn.index).
# ---------------------------------------------------------------------------
[txn]
max_timeout_ms = 900000                        # cap for transaction.timeout.ms
transactional_id_expiration_ms = 604800000     # 7 days idle -> transactional id expired
sweep_interval_ms = 10000                      # timeout abort / Prepare* recovery sweeper

# ---------------------------------------------------------------------------
# Share groups (KIP-932): ShareGroupHeartbeat/Describe, ShareFetch, ShareAcknowledge.
# State: <storage_dir>/__share_state/
# ---------------------------------------------------------------------------
[share]
heartbeat_interval_ms = 5000
session_timeout_ms = 45000
lock_timeout_ms = 30000            # acquisition lock duration
max_delivery_attempts = 5          # then the record is archived (and sent to the DLQ if configured)
max_in_flight = 2000               # per share-partition in-flight record cap
auto_offset_reset = "latest"       # or "earliest"
isolation_level = "read_uncommitted"   # or "read_committed"
default_max_records = 500
# dlq_topic = "{topic}.dlq"        # optional dead-letter topic template ({topic}, {group})
sweep_interval_ms = 1000
