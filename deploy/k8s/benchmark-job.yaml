apiVersion: batch/v1
kind: Job
metadata:
  name: aerostream-benchmark
  namespace: aerostream
  labels:
    app.kubernetes.io/name: aerostream
    app.kubernetes.io/component: benchmark
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aerostream
        app.kubernetes.io/component: benchmark
    spec:
      restartPolicy: Never
      containers:
        - name: benchmark-runner
          image: aerostream-client:latest
          imagePullPolicy: IfNotPresent
          command: ["client"]
          args:
            - "--controller"
            - "aerostream-controller.aerostream.svc.cluster.local:8001"
            - "bench"
            - "--producers"
            - "20"
            - "--messages"
            - "5000"
            - "--size"
            - "1024"
            - "--topic"
            - "k8s-bench"
            - "--partition"
            - "0"
          resources:
            requests:
              cpu: "1000m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
