apiVersion: v1
kind: Service
metadata:
  name: controller-headless
  namespace: aeromq
  labels:
    app.kubernetes.io/name: aeromq
    app.kubernetes.io/component: controller
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: aeromq
    app.kubernetes.io/component: controller
  ports:
    - name: raft
      port: 7001
      targetPort: 7001
    - name: grpc
      port: 8001
      targetPort: 8001
    - name: http
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: controller
  namespace: aeromq
  labels:
    app.kubernetes.io/name: aeromq
    app.kubernetes.io/component: controller
spec:
  serviceName: controller-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: aeromq
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aeromq
        app.kubernetes.io/component: controller
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: controller
          image: aeromq-controller:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              ORDINAL="${HOSTNAME##*-}"
              NODE_ID="node$((ORDINAL + 1))"
              FQDN="${HOSTNAME}.controller-headless.aeromq.svc.cluster.local"
              RAFT_ADDR="${FQDN}:7001"
              BOOTSTRAP_HOST="controller-0.controller-headless.aeromq.svc.cluster.local"

              echo "[AeroMQ Controller Pod ${HOSTNAME}] Starting node ${NODE_ID} with Raft address ${RAFT_ADDR}..."

              if [ "${ORDINAL}" = "0" ]; then
                echo "[AeroMQ Controller Pod ${HOSTNAME}] Node 0 bootstrapping initial cluster..."
                exec controller \
                  -id "${NODE_ID}" \
                  -raft-addr "${RAFT_ADDR}" \
                  -grpc-addr "0.0.0.0:8001" \
                  -http-addr "0.0.0.0:9001" \
                  -data-dir "/data" \
                  -bootstrap
              else
                echo "[AeroMQ Controller Pod ${HOSTNAME}] Node ${ORDINAL} joining Raft cluster via http://${BOOTSTRAP_HOST}:9001..."
                exec controller \
                  -id "${NODE_ID}" \
                  -raft-addr "${RAFT_ADDR}" \
                  -grpc-addr "0.0.0.0:8001" \
                  -http-addr "0.0.0.0:9001" \
                  -data-dir "/data" \
                  -join "http://${BOOTSTRAP_HOST}:9001"
              fi
          ports:
            - name: raft
              containerPort: 7001
            - name: grpc
              containerPort: 8001
            - name: http
              containerPort: 9001
          livenessProbe:
            httpGet:
              path: /status
              port: 9001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /status
              port: 9001
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/aeromq
      volumes:
        - name: config
          configMap:
            name: aeromq-config
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: aeromq
          app.kubernetes.io/component: controller
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
