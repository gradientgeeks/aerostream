apiVersion: v1
kind: Service
metadata:
  name: broker-headless
  namespace: aeromq
  labels:
    app.kubernetes.io/name: aeromq
    app.kubernetes.io/component: broker
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: aeromq
    app.kubernetes.io/component: broker
  ports:
    - name: data
      port: 9091
      targetPort: 9091
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: broker
  namespace: aeromq
  labels:
    app.kubernetes.io/name: aeromq
    app.kubernetes.io/component: broker
spec:
  serviceName: broker-headless
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aeromq
      app.kubernetes.io/component: broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aeromq
        app.kubernetes.io/component: broker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: broker
          image: aeromq-broker:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              ORDINAL="${HOSTNAME##*-}"
              BROKER_ID="$((ORDINAL + 1))"
              BROKER_HOST="${HOSTNAME}.broker-headless.aeromq.svc.cluster.local"
              CONTROLLER_ENDPOINT="http://controller-headless.aeromq.svc.cluster.local:8001"

              echo "[AeroMQ Broker Pod ${HOSTNAME}] Initializing Broker ID ${BROKER_ID} on host ${BROKER_HOST}..."
              echo "[AeroMQ Broker Pod ${HOSTNAME}] Connecting to Controller: ${CONTROLLER_ENDPOINT}..."

              exec rust-broker \
                --id "${BROKER_ID}" \
                --host "${BROKER_HOST}" \
                --data-port 9091 \
                --controller "${CONTROLLER_ENDPOINT}" \
                --storage-dir "/data"
          ports:
            - name: data
              containerPort: 9091
          livenessProbe:
            tcpSocket:
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: 9091
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "1000m"
              memory: 1Gi
            limits:
              cpu: "2000m"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/aeromq
      volumes:
        - name: config
          configMap:
            name: aeromq-config
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: aeromq
          app.kubernetes.io/component: broker
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
