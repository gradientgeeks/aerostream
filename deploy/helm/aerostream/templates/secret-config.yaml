apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aerostream.configSecret" . }}
  labels:
    {{- include "aerostream.labels" . | nindent 4 }}
type: Opaque
stringData:
  controller.toml: |
    # Rendered by Helm. Node identity / addresses are passed as flags by the StatefulSet.
    [raft]
    heartbeat_timeout_ms = {{ include "aerostream.int" .Values.controller.raft.heartbeatTimeoutMs }}
    election_timeout_ms = {{ include "aerostream.int" .Values.controller.raft.electionTimeoutMs }}
    leader_lease_timeout_ms = {{ include "aerostream.int" .Values.controller.raft.leaderLeaseTimeoutMs }}
    commit_timeout_ms = {{ include "aerostream.int" .Values.controller.raft.commitTimeoutMs }}

    [cluster]
    failure_detection_interval_ms = {{ include "aerostream.int" .Values.controller.cluster.failureDetectionIntervalMs }}
    broker_inactive_timeout_ms = {{ include "aerostream.int" .Values.controller.cluster.brokerInactiveTimeoutMs }}
    replica_lag_tolerance = {{ include "aerostream.int" .Values.controller.cluster.replicaLagTolerance }}

    [tls]
    enabled = {{ .Values.tls.enabled }}
    {{- if .Values.tls.existingSecret }}
    cert_file = "/etc/aerostream/tls/tls.crt"
    key_file = "/etc/aerostream/tls/tls.key"
    {{- /* The Go controller has no separate mTLS toggle: setting ca_file at all makes it require
    and verify a client cert (RequireAndVerifyClientCert), so this is gated strictly on
    requireClientCert, unlike the broker's ca_file below which also verifies the controller's own
    server cert and so is included whenever a secret is configured. */}}
    {{- if .Values.tls.requireClientCert }}
    ca_file = "/etc/aerostream/tls/ca.crt"
    {{- end }}
    {{- end }}

    [auth]
    {{- with .Values.auth.token }}
    token = {{ . | quote }}
    {{- end }}

  broker.toml: |
    # Rendered by Helm. Broker id / host / ports / controller / rack are passed as flags.
    replica_selector = {{ .Values.broker.replicaSelector | quote }}
    compression_type = {{ .Values.broker.compressionType | quote }}
    group_initial_rebalance_delay_ms = {{ include "aerostream.int" .Values.broker.groupInitialRebalanceDelayMs }}

    [storage]
    max_segment_size = {{ include "aerostream.int" .Values.broker.storage.maxSegmentSize }}
    max_retention_size = {{ include "aerostream.int" .Values.broker.storage.maxRetentionSize }}
    max_retention_age_secs = {{ include "aerostream.int" .Values.broker.storage.maxRetentionAgeSecs }}
    compaction_enabled = {{ .Values.broker.storage.compactionEnabled }}
    dirty_ratio_threshold = {{ .Values.broker.storage.dirtyRatioThreshold }}
    tombstone_retention_secs = {{ include "aerostream.int" .Values.broker.storage.tombstoneRetentionSecs }}
    writeback_bytes = {{ include "aerostream.int" (.Values.broker.storage.writebackBytes | default 8388608) }}
    drop_cache_after_writeback = {{ .Values.broker.storage.dropCacheAfterWriteback | default false }}

    [txn]
    max_timeout_ms = {{ include "aerostream.int" .Values.broker.txn.maxTimeoutMs }}
    transactional_id_expiration_ms = {{ include "aerostream.int" .Values.broker.txn.transactionalIdExpirationMs }}
    sweep_interval_ms = {{ include "aerostream.int" .Values.broker.txn.sweepIntervalMs }}

    [share]
    heartbeat_interval_ms = {{ include "aerostream.int" .Values.broker.share.heartbeatIntervalMs }}
    session_timeout_ms = {{ include "aerostream.int" .Values.broker.share.sessionTimeoutMs }}
    lock_timeout_ms = {{ include "aerostream.int" .Values.broker.share.lockTimeoutMs }}
    max_delivery_attempts = {{ include "aerostream.int" .Values.broker.share.maxDeliveryAttempts }}
    max_in_flight = {{ include "aerostream.int" .Values.broker.share.maxInFlight }}
    auto_offset_reset = {{ .Values.broker.share.autoOffsetReset | quote }}
    isolation_level = {{ .Values.broker.share.isolationLevel | quote }}
    default_max_records = {{ include "aerostream.int" .Values.broker.share.defaultMaxRecords }}
    sweep_interval_ms = {{ include "aerostream.int" .Values.broker.share.sweepIntervalMs }}

    [tls]
    enabled = {{ .Values.tls.enabled }}
    kafka_enabled = {{ .Values.tls.kafkaEnabled }}
    require_client_cert = {{ .Values.tls.requireClientCert }}
    client_cert_principal = {{ .Values.tls.clientCertPrincipal }}
    {{- if .Values.tls.existingSecret }}
    cert_file = "/etc/aerostream/tls/tls.crt"
    key_file = "/etc/aerostream/tls/tls.key"
    ca_file = "/etc/aerostream/tls/ca.crt"
    {{- end }}
    {{- $clientSecret := .Values.tls.clientExistingSecret | default .Values.tls.existingSecret }}
    {{- if $clientSecret }}
    client_cert_file = "/etc/aerostream/tls-client/tls.crt"
    client_key_file = "/etc/aerostream/tls-client/tls.key"
    {{- end }}

    [auth]
    {{- with .Values.auth.token }}
    token = {{ . | quote }}
    {{- end }}
    {{- with .Values.broker.extraConfig }}
    {{ "" }}
    {{- . | nindent 4 }}
    {{- end }}
