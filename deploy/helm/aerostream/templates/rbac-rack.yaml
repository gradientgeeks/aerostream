{{- if and .Values.broker.rack.enabled (not .Values.broker.rack.value) }}
# Lets the broker init container read its own node's topology label (rack / zone).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aerostream.fullname" . }}-node-reader
  labels:
    {{- include "aerostream.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aerostream.fullname" . }}-node-reader
  labels:
    {{- include "aerostream.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aerostream.fullname" . }}-node-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "aerostream.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
