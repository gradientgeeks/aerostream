# ==============================================================================
# AeroStream CI/CD: Automated AI Documentation Writer
# Powered by Google Antigravity & Gemini Engine
#
# Inspects code diffs on pushed commits to main, analyzes changes across the
# Rust Broker, Go Controller, Proto contracts, and Client SDKs, updates
# MkDocs Material website docs (docs/) and core whitepapers (core/docs/),
# and opens an automated Pull Request with technical documentation updates.
# ==============================================================================

name: Automated AI Documentation Writer

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'core/docs/**'
      - '*.md'
      - '.github/workflows/ai-docs-writer.yml'
      - 'site/dist/**'

  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Base commit or branch to compare against (e.g. HEAD~1 or origin/main)'
        required: false
        default: 'HEAD~1'
      dry_run:
        description: 'Dry run: analyze diff without modifying files or opening PR'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  write-documentation:
    name: Generate & Synchronize Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: docs/requirements.txt

      - name: Install Documentation Validation Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Run AI Documentation Writer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          BASE_INPUT: ${{ github.event.inputs.base_ref }}
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "$BASE_INPUT" ]; then
            ARGS="$ARGS --base $BASE_INPUT"
          fi
          
          python3 scripts/ai_docs_writer.py $ARGS

      - name: Check for Documentation Changes
        id: git-check
        run: |
          if [ -f "pr_summary.md" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Documentation changes detected and PR summary prepared."
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No documentation changes required for this commit range."
          fi

      - name: Create Pull Request with Documentation Updates
        if: steps.git-check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs(automated): synchronize documentation with latest codebase changes"
          committer: "AeroStream Bot <bot@aerostream.io>"
          author: "AeroStream Doc Writer <bot@aerostream.io>"
          branch: "automated-ai-docs"
          base: "main"
          delete-branch: true
          title: "docs(automated): synchronize documentation with latest codebase changes"
          body-path: pr_summary.md
          labels: |
            documentation
            automated-pr
