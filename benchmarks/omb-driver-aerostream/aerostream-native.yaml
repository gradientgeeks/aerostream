# AeroStream native protocol (TCP data plane on 9091, topics via the controller REST API on 9001).
# Driver: driver-aerostream (one pipelined connection per partition per producer; one multi-entry long-poll fetch thread per partition).
name: AeroStream-Native
driverClass: io.openmessaging.benchmark.driver.aerostream.AeroStreamBenchmarkDriver

controllerHttpUrl: http://localhost:9001
brokerAddress: localhost:9091
replicationFactor: 1
connectionsPerProducer: 1
lingerMicros: 1000
maxInFlightPerConnection: 4096
fetchMaxBytes: 1048576
fetchMaxWaitMs: 500
