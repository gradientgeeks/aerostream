<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Dual Go Gradient (#0284C7 -> #00E5FF -> #FFFFFF) -->
    <linearGradient id="favGoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Dual Rust Gradient (#FF5722 -> #FFB300 -> #FFFFFF) -->
    <linearGradient id="favRustGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="65%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Trail Gradients -->
    <linearGradient id="favGoTrail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="favRustTrail" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF5722" stop-opacity="0" />
      <stop offset="100%" stop-color="#FF5722" stop-opacity="1" />
    </linearGradient>

    <radialGradient id="favHubGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <path id="favVane" d="M 48.6 32 C 51.5 24.2 61.2 16.5 76.5 19.8 C 77.4 20.5 77.2 21.5 76.2 22.3 C 63.8 26.6 57.2 30.2 54.4 32.7 A 18.2 18.2 0 0 0 48.6 32 Z" />
  </defs>

  <!-- Dark Disc Base for high contrast across browser tab themes -->
  <circle cx="50" cy="50" r="48" fill="#0b1120" />

  <!-- Speed Orbit Trails -->
  <circle cx="50" cy="50" r="46.5" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="0.75" />
  <path d="M 50 3.5 A 46.5 46.5 0 0 1 96.5 50" fill="none" stroke="url(#favGoTrail)" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="96.5" cy="50" r="2" fill="#00E5FF" />
  <path d="M 50 96.5 A 46.5 46.5 0 0 1 3.5 50" fill="none" stroke="url(#favRustTrail)" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="3.5" cy="50" r="2" fill="#FF5722" />

  <!-- Outer Shroud -->
  <circle cx="50" cy="50" r="43" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />

  <!-- 6 Swept-Back Turbine Vanes -->
  <g transform="rotate(0 50 50)" fill="url(#favGoGrad)"><use href="#favVane" /></g>
  <g transform="rotate(60 50 50)" fill="url(#favRustGrad)"><use href="#favVane" /></g>
  <g transform="rotate(120 50 50)" fill="url(#favGoGrad)"><use href="#favVane" /></g>
  <g transform="rotate(180 50 50)" fill="url(#favRustGrad)"><use href="#favVane" /></g>
  <g transform="rotate(240 50 50)" fill="url(#favGoGrad)"><use href="#favVane" /></g>
  <g transform="rotate(300 50 50)" fill="url(#favRustGrad)"><use href="#favVane" /></g>

  <!-- Inner mmap Hub -->
  <circle cx="50" cy="50" r="18.5" fill="url(#favHubGrad)" stroke="#00E5FF" stroke-width="0.8" />
  <circle cx="50" cy="50" r="15" fill="none" stroke="#00E5FF" stroke-width="0.9" stroke-dasharray="2 1.5" opacity="0.85" />
  <circle cx="50" cy="50" r="12" fill="#070d19" />

  <!-- Raft Consensus Quorum Triangle -->
  <polygon points="50,42 42.5,54.5 57.5,54.5" fill="rgba(0, 229, 255, 0.15)" stroke="#00E5FF" stroke-width="1" />
  <circle cx="42.5" cy="54.5" r="2" fill="#0284C7" stroke="#00E5FF" stroke-width="0.6" />
  <circle cx="57.5" cy="54.5" r="2" fill="#FF5722" stroke="#FFB300" stroke-width="0.6" />
  <circle cx="50" cy="42" r="2.8" fill="#FFFFFF" stroke="#00E5FF" stroke-width="1" />
</svg>
