<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AeroMQ Console</title>
  <base href="/aeromq/console/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="assets/logo-turbine.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&family=Material+Icons&family=Material+Symbols+Outlined&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background-color: #080B11;
      color: #FFFFFF;
      font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .initial-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
    }
    .initial-loader-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #F8FAFC;
    }
    .initial-loader-sub {
      font-size: 13px;
      color: #94A3B8;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>
<body class="mat-typography mat-app-background">
  <app-root>
    <div class="initial-loader">
      <img src="assets/logo-turbine.svg" width="64" height="64" alt="AeroMQ Turbine Logo" />
      <div class="initial-loader-title">AeroMQ Console</div>
      <div class="initial-loader-sub">Loading Data Plane...</div>
    </div>
  </app-root>
</body>
</html>
