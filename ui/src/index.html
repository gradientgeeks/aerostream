<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AeroStream Console</title>
  <base href="/aerostream/console/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="assets/logo-turbine.svg">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&family=Material+Icons&family=Material+Symbols+Outlined&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background-color: #080B11;
      color: #FFFFFF;
      font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .initial-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
    }
    .initial-loader-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #F8FAFC;
    }
    .initial-loader-sub {
      font-size: 13px;
      color: #94A3B8;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .static-svg-logo {
      width: 72px;
      height: 72px;
      display: block;
    }
  </style>
</head>
<body class="mat-typography mat-app-background">
  <app-root>
    <div class="initial-loader">
      <!-- Direct Inline Static SVG Logo -->
      <svg class="static-svg-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="idxGoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0284C7" />
            <stop offset="60%" stop-color="#00E5FF" />
            <stop offset="100%" stop-color="#FFFFFF" />
          </linearGradient>
          <linearGradient id="idxRustGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FF5722" />
            <stop offset="65%" stop-color="#FFB300" />
            <stop offset="100%" stop-color="#FFFFFF" />
          </linearGradient>
          <linearGradient id="idxGoTrail" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00E5FF" stop-opacity="0" />
            <stop offset="70%" stop-color="#00E5FF" stop-opacity="0.6" />
            <stop offset="100%" stop-color="#00E5FF" />
          </linearGradient>
          <linearGradient id="idxRustTrail" x1="100%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#FF5722" stop-opacity="0" />
            <stop offset="70%" stop-color="#FFB300" stop-opacity="0.6" />
            <stop offset="100%" stop-color="#FF5722" />
          </linearGradient>
          <radialGradient id="idxHubGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#1e293b" />
            <stop offset="65%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#020617" />
          </radialGradient>
          <radialGradient id="idxLeaderGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="35%" stop-color="#00E5FF" />
            <stop offset="100%" stop-color="#0284C7" />
          </radialGradient>
          <g id="idxAirfoil">
            <path d="M 48.6 32 C 51.5 24.2 61.2 16.5 76.5 19.8 C 77.4 20.5 77.2 21.5 76.2 22.3 C 63.8 26.6 57.2 30.2 54.4 32.7 A 18.2 18.2 0 0 0 48.6 32 Z" />
            <path d="M 49.6 31.2 C 52.4 24.6 61.6 18.2 75.2 20.4" fill="none" stroke="rgba(255, 255, 255, 0.55)" stroke-width="0.65" stroke-linecap="round" />
          </g>
        </defs>

        <!-- Speed Orbit Trails -->
        <circle cx="50" cy="50" r="46.5" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="0.6" />
        <circle cx="50" cy="50" r="46.5" fill="none" stroke="rgba(0, 229, 255, 0.2)" stroke-width="0.8" stroke-dasharray="2 8" />
        <path d="M 50 3.5 A 46.5 46.5 0 0 1 96.5 50" fill="none" stroke="url(#idxGoTrail)" stroke-width="1.8" stroke-linecap="round" />
        <circle cx="96.5" cy="50" r="1.8" fill="#00E5FF" />
        <path d="M 50 96.5 A 46.5 46.5 0 0 1 3.5 50" fill="none" stroke="url(#idxRustTrail)" stroke-width="1.8" stroke-linecap="round" />
        <circle cx="3.5" cy="50" r="1.8" fill="#FF5722" />
        <circle cx="82.8" cy="17.2" r="1.2" fill="#FFFFFF" opacity="0.9" />
        <circle cx="17.2" cy="82.8" r="1.2" fill="#FFB300" opacity="0.9" />

        <!-- Shroud Ring -->
        <circle cx="50" cy="50" r="43.5" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="0.8" />
        <circle cx="50" cy="50" r="42.5" fill="none" stroke="rgba(0, 229, 255, 0.25)" stroke-width="0.5" stroke-dasharray="1 3" />

        <!-- 6 Swept-Back Vanes (Static Dual Engines) -->
        <g transform="rotate(0 50 50)" fill="url(#idxGoGrad)"><use href="#idxAirfoil" /></g>
        <g transform="rotate(60 50 50)" fill="url(#idxRustGrad)"><use href="#idxAirfoil" /></g>
        <g transform="rotate(120 50 50)" fill="url(#idxGoGrad)"><use href="#idxAirfoil" /></g>
        <g transform="rotate(180 50 50)" fill="url(#idxRustGrad)"><use href="#idxAirfoil" /></g>
        <g transform="rotate(240 50 50)" fill="url(#idxGoGrad)"><use href="#idxAirfoil" /></g>
        <g transform="rotate(300 50 50)" fill="url(#idxRustGrad)"><use href="#idxAirfoil" /></g>

        <!-- Inner Hub -->
        <circle cx="50" cy="50" r="18.5" fill="url(#idxHubGrad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="0.7" />
        <circle cx="50" cy="50" r="17.2" fill="none" stroke="#00E5FF" stroke-width="0.8" opacity="0.5" />
        <circle cx="50" cy="50" r="15.5" fill="none" stroke="#00E5FF" stroke-width="0.9" stroke-dasharray="2.2 1.8" opacity="0.85" />
        <circle cx="65" cy="50" r="1" fill="#00E5FF" />
        <circle cx="35" cy="50" r="1" fill="#FF5722" />
        <circle cx="50" cy="50" r="12" fill="#070d19" stroke="rgba(255, 255, 255, 0.1)" stroke-width="0.5" />

        <!-- Raft Consensus Quorum -->
        <polygon points="50,42 42.5,54.5 57.5,54.5" fill="rgba(0, 229, 255, 0.08)" />
        <line x1="50" y1="42" x2="42.5" y2="54.5" stroke="#00E5FF" stroke-width="0.85" />
        <line x1="50" y1="42" x2="57.5" y2="54.5" stroke="#00E5FF" stroke-width="0.85" />
        <line x1="42.5" y1="54.5" x2="57.5" y2="54.5" stroke="#FFB300" stroke-width="0.85" />
        <circle cx="50" cy="50.3" r="0.8" fill="#FFFFFF" opacity="0.8" />
        <circle cx="42.5" cy="54.5" r="1.8" fill="#0284C7" stroke="#00E5FF" stroke-width="0.6" />
        <circle cx="42.5" cy="54.5" r="0.7" fill="#FFFFFF" />
        <circle cx="57.5" cy="54.5" r="1.8" fill="#FF5722" stroke="#FFB300" stroke-width="0.6" />
        <circle cx="57.5" cy="54.5" r="0.7" fill="#FFFFFF" />
        <circle cx="50" cy="42" r="3" fill="none" stroke="#00E5FF" stroke-width="0.5" opacity="0.6" />
        <circle cx="50" cy="42" r="2.2" fill="url(#idxLeaderGrad)" stroke="#FFFFFF" stroke-width="0.7" />
        <circle cx="50" cy="42" r="0.8" fill="#FFFFFF" />
      </svg>
      <div class="initial-loader-title">AeroStream Console</div>
      <div class="initial-loader-sub">Loading Distributed Event Stream...</div>
    </div>
  </app-root>
</body>
</html>
