<mat-sidenav-container class="app-layout w-full max-w-full overflow-x-hidden" [hasBackdrop]="true">
  <!-- Mobile & Tablet Responsive Sidenav Drawer -->
  <mat-sidenav #mobileNav mode="over" position="start" class="mobile-sidenav">
    <div class="mobile-sidenav-header">
      <div class="brand-container" (click)="mobileNav.close()" routerLink="/topics">
        <div class="brand-logo">
          <app-turbine-logo [size]="32"></app-turbine-logo>
        </div>
        <div class="brand-titles">
          <span class="brand-name">Aero<span class="brand-mq">MQ</span></span>
          <span class="brand-badge mq-badge">Console</span>
        </div>
      </div>
      <button mat-icon-button (click)="mobileNav.close()" aria-label="Close navigation menu" class="close-menu-btn">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <mat-divider></mat-divider>

    <!-- Mobile Nav List -->
    <mat-nav-list class="mobile-nav-list">
      <a mat-list-item routerLink="/cluster" routerLinkActive="active-link" (click)="mobileNav.close()">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Cluster Overview</span>
      </a>
      <a mat-list-item routerLink="/topics" routerLinkActive="active-link" (click)="mobileNav.close()">
        <mat-icon matListItemIcon>folder_open</mat-icon>
        <span matListItemTitle>Topics & Partitions</span>
      </a>
      <a mat-list-item routerLink="/messages" routerLinkActive="active-link" (click)="mobileNav.close()">
        <mat-icon matListItemIcon>mail</mat-icon>
        <span matListItemTitle>Message Explorer</span>
      </a>
      <a mat-list-item routerLink="/groups" routerLinkActive="active-link" (click)="mobileNav.close()">
        <mat-icon matListItemIcon>group_work</mat-icon>
        <span matListItemTitle>Consumer Groups</span>
      </a>
      <a mat-list-item routerLink="/producer" routerLinkActive="active-link" (click)="mobileNav.close()">
        <mat-icon matListItemIcon>send</mat-icon>
        <span matListItemTitle>Web Producer</span>
      </a>
    </mat-nav-list>

    <mat-divider></mat-divider>

    <!-- Mobile Sidenav Footer -->
    <div class="mobile-sidenav-footer">
      <div class="cluster-status-pill">
        <span class="status-dot"></span>
        <span class="status-text">Controller Online</span>
      </div>

      <button mat-stroked-button (click)="themeService.toggleTheme()" class="mobile-theme-toggle-btn">
        <mat-icon>{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
        <span>Switch to {{ themeService.isDark() ? 'Light Mode' : 'Dark Mode' }}</span>
      </button>
    </div>
  </mat-sidenav>

  <!-- Main Sidenav Content Shell -->
  <mat-sidenav-content class="app-sidenav-content w-full max-w-full overflow-x-hidden">
    <!-- Top Navigation Header -->
    <header class="app-header w-full max-w-full">
      <div class="header-inner w-full max-w-full">
        <!-- Left: Hamburger Menu (Mobile/Tablet) + Logo Brand -->
        <div class="header-left">
          <button
            mat-icon-button
            class="mobile-menu-btn"
            (click)="mobileNav.toggle()"
            aria-label="Toggle navigation menu">
            <mat-icon>menu</mat-icon>
          </button>

          <div class="brand-container" routerLink="/topics">
            <div class="brand-logo">
              <app-turbine-logo [size]="32"></app-turbine-logo>
            </div>
            <div class="brand-titles">
              <span class="brand-name">Aero<span class="brand-mq">MQ</span></span>
              <span class="brand-badge mq-badge">Console</span>
            </div>
          </div>
        </div>

        <!-- Center: Desktop Nav Links (Hidden on Tablets & Mobile) -->
        <nav class="nav-links desktop-only">
          <a routerLink="/cluster" routerLinkActive="active" class="nav-link">
            <mat-icon>dashboard</mat-icon>
            <span>Cluster</span>
          </a>
          <a routerLink="/topics" routerLinkActive="active" class="nav-link">
            <mat-icon>folder_open</mat-icon>
            <span>Topics</span>
          </a>
          <a routerLink="/messages" routerLinkActive="active" class="nav-link">
            <mat-icon>mail</mat-icon>
            <span>Message Explorer</span>
          </a>
          <a routerLink="/groups" routerLinkActive="active" class="nav-link">
            <mat-icon>group_work</mat-icon>
            <span>Consumer Groups</span>
          </a>
          <a routerLink="/producer" routerLinkActive="active" class="nav-link">
            <mat-icon>send</mat-icon>
            <span>Producer</span>
          </a>
        </nav>

        <!-- Right: Status Pill & Theme Toggle Button -->
        <div class="header-right">
          <div class="cluster-status-pill desktop-only">
            <span class="status-dot"></span>
            <span class="status-text">Controller Online</span>
          </div>

          <button
            mat-icon-button
            (click)="themeService.toggleTheme()"
            [matTooltip]="themeService.isDark() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
            class="theme-toggle-btn"
            aria-label="Toggle theme">
            <mat-icon>{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Page Content -->
    <main class="main-content w-full max-w-full overflow-x-hidden">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
