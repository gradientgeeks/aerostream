<mat-sidenav-container class="app-layout w-full max-w-full overflow-x-hidden" [hasBackdrop]="isMobile()">
  <!-- Enterprise Sidenav: Persistent Side on Desktop, Drawer Over on Mobile/Tablet -->
  <mat-sidenav
    #sidenav
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="isMobile() ? isMobileDrawerOpen() : true"
    (closed)="isMobileDrawerOpen.set(false)"
    [class.sidebar-collapsed]="!isMobile() && isSidebarCollapsed()"
    class="app-sidebar"
  >
    <div class="sidebar-wrapper">
      <!-- Sidebar Brand Header -->
      <div class="sidebar-header">
        <a class="brand-link" routerLink="/cluster" (click)="closeMobileDrawer()">
          <div class="brand-logo">
            <app-turbine-logo [size]="28" [glow]="false"></app-turbine-logo>
          </div>
          <div class="brand-titles" *ngIf="isMobile() || !isSidebarCollapsed()">
            <span class="brand-name">Aero<span class="brand-mq">Stream</span></span>
            <span class="brand-badge mq-badge">Console</span>
          </div>
        </a>

        <!-- Mobile Drawer Close Button -->
        <button
          *ngIf="isMobile()"
          mat-icon-button
          (click)="closeMobileDrawer()"
          class="sidebar-action-btn"
          aria-label="Close navigation drawer"
        >
          <mat-icon>close</mat-icon>
        </button>

        <!-- Desktop Mini-Sidebar Collapse Button -->
        <button
          *ngIf="!isMobile() && !isSidebarCollapsed()"
          mat-icon-button
          (click)="toggleSidebar()"
          class="sidebar-action-btn"
          matTooltip="Collapse sidebar"
          aria-label="Collapse sidebar"
        >
          <mat-icon>chevron_left</mat-icon>
        </button>
      </div>

      <mat-divider></mat-divider>

      <!-- Scrollable Navigation Categories -->
      <div class="sidebar-scroll-container">
        <nav class="sidebar-nav" aria-label="Console Navigation">
          <div *ngFor="let section of navSections" class="nav-section">
            <div class="section-header" *ngIf="isMobile() || !isSidebarCollapsed()">
              <span class="section-title">{{ section.title }}</span>
            </div>
            <mat-divider *ngIf="!isMobile() && isSidebarCollapsed()" class="section-divider"></mat-divider>

            <div class="nav-items-group">
              <a
                *ngFor="let item of section.items"
                [routerLink]="item.path"
                routerLinkActive="active-link"
                (click)="closeMobileDrawer()"
                class="nav-link-item"
                [matTooltip]="(!isMobile() && isSidebarCollapsed()) ? item.label : ''"
                matTooltipPosition="right"
              >
                <div class="nav-icon-wrap">
                  <mat-icon>{{ item.icon }}</mat-icon>
                </div>
                <span class="nav-label" *ngIf="isMobile() || !isSidebarCollapsed()">
                  {{ item.label }}
                </span>
                <span
                  class="nav-badge"
                  *ngIf="(isMobile() || !isSidebarCollapsed()) && item.badge"
                  [ngClass]="item.badge.toLowerCase()"
                >
                  {{ item.badge }}
                </span>
              </a>
            </div>
          </div>
        </nav>
      </div>

      <mat-divider></mat-divider>

      <!-- Sidebar Footer (Cluster Status & Theme Switcher) -->
      <div class="sidebar-footer">
        <div class="footer-cluster-info" *ngIf="isMobile() || !isSidebarCollapsed()">
          <div class="cluster-status-pill">
            <span class="status-dot"></span>
            <span class="status-text">Controller Online</span>
          </div>
          <span class="engine-tag">Dual Engine Go + Rust</span>
        </div>

        <!-- Expanded Theme Toggle Button -->
        <button
          mat-stroked-button
          (click)="themeService.toggleTheme()"
          class="theme-toggle-wide-btn"
          *ngIf="isMobile() || !isSidebarCollapsed()"
        >
          <mat-icon>{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
          <span>Switch to {{ themeService.isDark() ? 'Light Mode' : 'Dark Mode' }}</span>
        </button>

        <!-- Mini-Sidebar Collapsed Theme Button -->
        <button
          mat-icon-button
          (click)="themeService.toggleTheme()"
          class="theme-toggle-icon-btn"
          *ngIf="!isMobile() && isSidebarCollapsed()"
          [matTooltip]="themeService.isDark() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
          matTooltipPosition="right"
          aria-label="Toggle theme"
        >
          <mat-icon>{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>
      </div>
    </div>
  </mat-sidenav>

  <!-- Main Sidenav Content Shell -->
  <mat-sidenav-content class="app-sidenav-content w-full max-w-full overflow-x-hidden">
    <!-- Top Control Bar (Breadcrumbs & Cluster Header) -->
    <header class="app-header w-full max-w-full">
      <div class="header-inner w-full max-w-full">
        <!-- Left: Toggle & Breadcrumb -->
        <div class="header-left">
          <button
            mat-icon-button
            (click)="toggleSidebar()"
            class="header-toggle-btn"
            [matTooltip]="isMobile() ? 'Open Navigation' : (isSidebarCollapsed() ? 'Expand Sidebar' : 'Collapse Sidebar')"
            aria-label="Toggle sidebar navigation"
          >
            <mat-icon>{{ isMobile() ? 'menu' : (isSidebarCollapsed() ? 'menu' : 'menu_open') }}</mat-icon>
          </button>

          <!-- Mobile Brand Indicator -->
          <div class="mobile-brand-title" *ngIf="isMobile()" routerLink="/cluster">
            <app-turbine-logo [size]="24" [glow]="false"></app-turbine-logo>
            <span class="brand-text">AeroStream</span>
          </div>

          <!-- Desktop Breadcrumbs -->
          <div class="breadcrumb-trail" *ngIf="!isMobile()">
            <span class="crumb-root" routerLink="/cluster">AeroStream</span>
            <mat-icon class="crumb-sep">chevron_right</mat-icon>
            <span class="crumb-current">{{ currentSectionTitle() }}</span>
          </div>
        </div>

        <!-- Right: Status Badges & Controls -->
        <div class="header-right">
          <div class="cluster-status-pill desktop-only">
            <span class="status-dot"></span>
            <span class="status-text">Controller Online</span>
          </div>

          <div class="kafka-port-tag desktop-only" matTooltip="Standard Kafka Protocol TCP Listener Active">
            <mat-icon class="port-icon">cable</mat-icon>
            <span>Port 9092</span>
          </div>

          <button
            mat-icon-button
            (click)="themeService.toggleTheme()"
            [matTooltip]="themeService.isDark() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
            class="theme-toggle-btn"
            aria-label="Toggle theme"
          >
            <mat-icon>{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Page Content Outlet -->
    <main class="main-content w-full max-w-full overflow-x-hidden">
      <div class="content-container w-full max-w-full">
        <router-outlet></router-outlet>
      </div>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
