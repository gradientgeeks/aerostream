[package]
name = "rust-broker"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tonic = { version = "0.11", features = ["tls"] }
prost = "0.12"
bytes = "1.5"
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio-rustls = "0.25"
rustls-pemfile = "2"
aws-sdk-s3 = "1"
aws-config = "1"
async-trait = "0.1.92"

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]
tempfile = "3"
