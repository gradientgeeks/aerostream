<div class="app-layout">
  <!-- Accessibility Skip Link -->
  <a href="#main-content" class="skip-to-content">Skip to main content</a>

  <!-- Top Sticky Header -->
  <header class="app-navbar" role="banner">
    <div class="navbar-container">
      <!-- Brand Logo & Title -->
      <a routerLink="/" class="brand-link" (click)="scrollToTop($event)">
        <app-turbine-logo [size]="34" [glow]="false" [animated]="true"></app-turbine-logo>
        <div class="brand-text">
          <div class="brand-title-row">
            <span class="brand-name">Aero<span class="brand-stream">Stream</span></span>
            <span class="brand-pill">v0.1.0</span>
          </div>
          <span class="brand-sub">by Gradient Geeks</span>
        </div>
      </a>

      <!-- Desktop Navigation Menu -->
      <nav class="desktop-nav" role="navigation" aria-label="Main Navigation">
        <a
          routerLink="/"
          fragment="architecture"
          (click)="navigateToSection('architecture', $event)"
          class="nav-link">
          Architecture
        </a>
        <a
          routerLink="/"
          fragment="features"
          (click)="navigateToSection('features', $event)"
          class="nav-link">
          Features
        </a>
        <a
          routerLink="/"
          fragment="quickstart"
          (click)="navigateToSection('quickstart', $event)"
          class="nav-link">
          Quickstart
        </a>
        <a
          routerLink="/docs"
          routerLinkActive="active"
          class="nav-link">
          Docs
        </a>
      </nav>

      <!-- Right Utility Actions -->
      <div class="navbar-actions">
        <!-- Theme Toggle -->
        <button
          type="button"
          class="action-btn theme-toggle-btn"
          (click)="toggleTheme()"
          [matTooltip]="themeService.isDark() ? 'Switch to Light Theme' : 'Switch to Dark Theme'"
          [attr.aria-label]="themeService.isDark() ? 'Switch to Light Theme' : 'Switch to Dark Theme'">
          <mat-icon>{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>

        <!-- GitHub Repository Link -->
        <a
          href="https://github.com/gradientgeeks/AeroMQ"
          target="_blank"
          rel="noopener noreferrer"
          class="action-btn github-link"
          matTooltip="GitHub Repository & Source"
          aria-label="GitHub Repository">
          <svg class="github-svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
        </a>

        <!-- Mobile Menu Toggle Button -->
        <button
          type="button"
          class="mobile-menu-toggle md:hidden"
          (click)="toggleMobileMenu()"
          aria-label="Toggle navigation menu">
          <mat-icon>{{ isMobileMenuOpen() ? 'close' : 'menu' }}</mat-icon>
        </button>
      </div>
    </div>

    <!-- Mobile Navigation Drawer -->
    <div class="mobile-drawer" [class.open]="isMobileMenuOpen()">
      <div class="mobile-nav-links">
        <a
          routerLink="/"
          fragment="architecture"
          (click)="navigateToSection('architecture', $event)"
          class="mobile-link">
          <mat-icon>account_tree</mat-icon>
          <span>Architecture</span>
        </a>
        <a
          routerLink="/"
          fragment="features"
          (click)="navigateToSection('features', $event)"
          class="mobile-link">
          <mat-icon>auto_awesome</mat-icon>
          <span>Features</span>
        </a>
        <a
          routerLink="/"
          fragment="quickstart"
          (click)="navigateToSection('quickstart', $event)"
          class="mobile-link">
          <mat-icon>terminal</mat-icon>
          <span>Quickstart</span>
        </a>
        <a
          routerLink="/docs"
          routerLinkActive="active"
          (click)="closeMobileMenu()"
          class="mobile-link">
          <mat-icon>menu_book</mat-icon>
          <span>Documentation</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Router Outlet Target -->
  <main id="main-content" class="app-main" role="main">
    <router-outlet></router-outlet>
  </main>
</div>
