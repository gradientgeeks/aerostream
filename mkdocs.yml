site_name: AeroStream Documentation
site_description: High-Performance Distributed Event Streaming Platform (Go Raft Consensus + Rust Shard-per-Core Storage)
site_author: Gradient Geeks
site_url: https://aerostream.gradientgeeks.com/docs/
repo_url: https://github.com/gradientgeeks/aerostream
repo_name: gradientgeeks/aerostream

docs_dir: docs
site_dir: site/dist/site/browser/docs

theme:
  name: material
  logo: images/logo.svg
  favicon: images/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    # Palette toggle for dark mode (default)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: cyan
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gradientgeeks/aerostream
    - icon: fontawesome/solid/globe
      link: https://aerostream.gradientgeeks.com/

nav:
  - Home: https://aerostream.gradientgeeks.com/
  - Overview: index.md
  - Architecture:
      - Core Architecture: ARCHITECTURE.md
      - Shard-per-Core Engine: SHARD_PER_CORE.md
      - Distributed Systems Design: DISTRIBUTED_SYSTEMS_DESIGN.md
      - Kafka Port Optimization: KAFKA_PORT_OPTIMIZATION_RESEARCH.md
      - Comparison & Roadmap: FEATURE_COMPARISON_AND_ROADMAP.md
  - Getting Started:
      - Docker Quickstart: DOCKER_QUICKSTART.md
      - Kubernetes Quickstart: K8S_QUICKSTART.md
      - Helm Chart Quickstart: HELM_QUICKSTART.md
  - API Reference: API_REFERENCE.md
  - Operations & Benchmarks:
      - Operator Guide: OPERATOR_GUIDE.md
      - OpenMessaging Benchmark (OMB): OPENMESSAGING_BENCHMARK_GUIDE.md
