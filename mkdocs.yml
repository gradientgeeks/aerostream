site_name: AeroStream Documentation
site_description: High-Performance Distributed Event Streaming Platform (Go Raft Consensus + Rust Shard-per-Core Storage)
site_author: Gradient Geeks
site_url: https://aerostream.gradientgeeks.com/docs/
repo_url: https://github.com/gradientgeeks/aerostream
repo_name: gradientgeeks/aerostream

docs_dir: docs
site_dir: site/dist/site/browser/docs

theme:
  name: material
  logo: images/logo.svg
  favicon: images/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    # Palette toggle for dark mode (default)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: cyan
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gradientgeeks/aerostream
    - icon: fontawesome/solid/globe
      link: https://aerostream.gradientgeeks.com/

nav:
  - Home: https://aerostream.gradientgeeks.com/
  - Getting Started:
      - Platform Overview: index.md
  - Architecture:
      - System Architecture: architecture.md
      - Performance Benchmarks: benchmarks.md
      - Architecture Diagrams: diagrams/README.md
  - Protocols & SDKs:
      - Native Client SDKs: sdks.md
      - Kafka Wire Compatibility: kafka-protocol.md
  - Engine Capabilities:
      - Schema Registry: schema-registry.md
      - Stream Transforms: transforms.md
      - Multi-Cloud Tiered Storage: tiered-storage.md
  - Operations & Security:
      - Security & RBAC: security-rbac.md
      - Cluster Operations: operations.md
      - Contributor Agreement (CLA): cla.md
