[package]
name = "aerostream-client"
version = "0.1.0"
edition = "2021"
description = "Official production-grade Rust client SDK for the AeroStream native binary protocol"
license = "Apache-2.0"
repository = "https://github.com/gradientgeeks/aerostream-sdk"
homepage = "https://aerostream.gradientgeeks.com"
keywords = ["aeromq", "aerostream", "streaming", "messaging", "client"]

[dependencies]
tokio = { version = "1.35", features = ["net", "time", "sync", "io-util", "rt-multi-thread", "macros"] }
bytes = "1.5"
thiserror = "1.0"
tracing = "0.1"
async-trait = "0.1"
futures-core = "0.3"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# Optional TLS support
tokio-rustls = { version = "0.25", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
rustls-pemfile = { version = "2", optional = true }

[features]
default = []
tls = ["dep:tokio-rustls", "dep:rustls", "dep:rustls-pemfile"]

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
