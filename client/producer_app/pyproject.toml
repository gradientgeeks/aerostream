[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aerostream-producer-app"
version = "0.1.0"
description = "Production-grade Kafka Producer test suite for AeroStream Kafka wire protocol"
readme = "README.md"
authors = [{ name = "AeroStream Kafka Team" }]
requires-python = ">=3.9"
dependencies = [
    "confluent-kafka>=2.3.0",
    "kafka-python-ng>=2.2.0",
    "lz4>=4.3.0",
    "zstandard>=0.22.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "cryptography>=41.0.0",
]

[project.scripts]
aerostream-producer = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
